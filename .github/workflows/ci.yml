name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors/warnings fail CI; the 2 pre-existing form-field deprecation infos
      # are non-fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
